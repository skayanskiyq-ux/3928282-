      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
      - name: Build libbox
        run: |
          git clone --depth 1 -b v1.10.7 https://github.com/SagerNet/sing-box /tmp/sb
          cd /tmp/sb
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android
          mkdir -p $GITHUB_WORKSPACE/app/libs
          cp libbox.aar $GITHUB_WORKSPACE/app/libs/
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyVpn-apk
          path: app/build/outputs/apk/debug/*.apk
