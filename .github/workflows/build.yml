      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
      - name: Build libbox
        run: |
          git clone --depth 1 -b v1.10.7 https://github.com/SagerNet/sing-box /tmp/sb
          cd /tmp/sb
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android
          mkdir -p $GITHUB_WORKSPACE/app/libs
          cp libbox.aar $GITHUB_WORKSPACE/app/libs/
      - name: Detect libbox package and dump API
        run: |
          mkdir -p /tmp/aar && cd /tmp/aar && unzip -o -q $GITHUB_WORKSPACE/app/libs/libbox.aar classes.jar
          PKGPATH=$(unzip -Z1 classes.jar | grep '/Libbox.class$' | sed 's|/Libbox.class||' | head -1)
          PKG=$(echo "$PKGPATH" | tr / .)
          echo "PKG=$PKG"
          sed -i "s/io\.nekohq\.libbox/$PKG/g" $GITHUB_WORKSPACE/app/src/main/java/com/my/vpn/VpnSvc.kt
          { echo "PACKAGE: $PKG"; for c in $(unzip -Z1 classes.jar | grep "^$PKGPATH/[A-Za-z]*\.class$" | sed 's|/|.|g; s|\.class$||'); do javap -public -cp classes.jar $c; done; } > $GITHUB_WORKSPACE/libbox-api.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-api
          path: libbox-api.txt
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyVpn-apk
          path: app/build/outputs/apk/debug/*.apk
